<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sembollemece</title>
  <link rel="stylesheet" href="css_js/atasozu_css.css">
  <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="../icons/site.webmanifest">
<meta property="og:title" content="Sembollemece'yi çözdüm! 🔎">
<meta property="og:description" content="Bugünkü Sembollemece'yi çözdüm! Sen de dene!">
<meta property="og:image" content="https://www.bulmacan.com/icons/share_sembollemece.png">
<meta property="og:url" content="https://www.bulmacan.com/atasozu/atasozu.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.bulmacan.com/icons/share_sembollemece.png">
</head>
<body>

<div id="smart-header"></div>
<script src="https://www.bulmacan.com/header/load_header.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadHeader("home"); });
</script>

<!-- ⏱️ Subtle stopwatch -->
<div id="timer" style="font-size:0.9em; font-weight:normal; color:#aaa; margin:8px 0; text-align:center;">⏱️ Süre: 00:00</div>

<!-- 🧩 Puzzle Clue and Solution -->
<div class="emoji-clue" id="emojiClue">Yükleniyor...</div>
<div class="selected-words" id="selectedWords">Çözüm: </div>

<!-- 🟩 Legend -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-box" style="background-color:#4caf50;"></div> Doğru kelime
  </div>
  <div class="legend-item">
    <div class="legend-box" style="background-color:#ffb300;"></div> Yanlış konum
  </div>
  <div class="legend-item">
    <div class="legend-box" style="background-color:#f44336;"></div> Yanlış kelime
  </div>
</div>

<!-- 🔡 Word Grid -->
<div class="grid" id="wordGrid"></div>

<br><br><br>
<div id="smart-footer"></div>
<link rel="stylesheet" href="https://www.bulmacan.com/footer/footer.css">
<script src="https://www.bulmacan.com/footer/load_footer.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadFooter(); });
</script>

<script>
let correctSequence = [];
let selected = [];
let loadedDate = null;

// ⏱️ Stopwatch
let startTime = null;
let timerInterval = null;

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById("timer").textContent = `⏱️ Süre: ${m}:${s}`;
}

function getSolveTime() {
  return Math.floor((Date.now() - startTime) / 1000);
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

const urlParams = new URLSearchParams(window.location.search);
const selectedDate = urlParams.get("date");

async function loadAtasozu() {
  const today = new Date();
  let puzzle = null;

  if (selectedDate) {
    try {
      const res = await fetch(`/atasozu/data/${selectedDate}.json`);
      if (res.ok) { puzzle = await res.json(); loadedDate = selectedDate; }
    } catch(e){}
  }

  if (!puzzle) {
    for (let i = 0; i < 3650; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dateStr = d.toISOString().split("T")[0];
      try {
        const res = await fetch(`/atasozu/data/${dateStr}.json`);
        if (res.ok) { puzzle = await res.json(); loadedDate = dateStr; console.log("Loaded fallback atasozu:", dateStr); break; }
      } catch(e){}
    }
  }

  if (!puzzle) {
    document.getElementById("emojiClue").textContent = "Bulmaca bulunamadı.";
    return;
  }

  correctSequence = puzzle.correctSequence;
  document.getElementById("emojiClue").textContent = puzzle.emojiClue;

  const grid = document.getElementById("wordGrid");
  grid.innerHTML = "";

  puzzle.wordGrid.forEach(word => {
    const div = document.createElement("div");
    div.className = "word";
    div.textContent = word;
    grid.appendChild(div);
  });

  startTimer();
}

loadAtasozu();

const grid = document.getElementById("wordGrid");

grid.addEventListener("click", function(e) {
  if (e.target.classList.contains("word")) {
    const wordElement = e.target;

    if (wordElement.classList.contains("selected")) {
      wordElement.classList.remove("selected", "wrong-red", "wrong-amber");
      selected = selected.filter(el => el !== wordElement);
    } else {
      if (selected.length >= correctSequence.length) {
        selected.forEach(el => el.classList.remove("selected", "wrong-red", "wrong-amber"));
        selected = [];
      }
      wordElement.classList.add("selected");
      selected.push(wordElement);
    }

    const selectedWords = selected.map(el => el.textContent.trim());
    document.getElementById("selectedWords").textContent = "Çözüm: " + selectedWords.join(" ");

    selected.forEach(el => el.classList.remove("wrong-red", "wrong-amber"));
    selected.forEach((el, i) => {
      const word = el.textContent.trim();
      if (correctSequence[i] === word) {
        // correct position — no extra class
      } else if (correctSequence.includes(word)) {
        el.classList.add("wrong-amber");
      } else {
        el.classList.add("wrong-red");
      }
    });

    if (selectedWords.join(" ") === correctSequence.join(" ")) {
      clearInterval(timerInterval);
      const solveTime = getSolveTime();
      const dateParam = loadedDate || getToday();
      window.location.href = `atasozu_success.html?date=${dateParam}&time=${solveTime}`;
    }
  }
});
</script>
</body>
</html>
