<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kümelemece – Tebrikler!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kümelemece bulmacasını çözdünüz!">
  <link rel="stylesheet" href="https://www.bulmacan.com/kumelemece/css_js/kumelemece_css.css">
  <link rel="stylesheet" href="https://www.bulmacan.com/success_shared.css">
  <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/icons/site.webmanifest">
  <meta property="og:title" content="Kümelemece'yi çözdüm! 🧩">
  <meta property="og:description" content="Bugünkü Kümelemece bulmacasını ben çözdüm! Sen de dene!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.bulmacan.com/kumelemece">
  <meta property="og:image" content="https://www.bulmacan.com/icons/share_kumelemece.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.bulmacan.com/icons/share_kumelemece.png">
</head>
<body>

<div id="smart-header"></div>
<script src="https://www.bulmacan.com/header/load_header.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadHeader("home"); });
</script>

<div class="success-container">

  <!-- Success banner -->
  <div class="success-banner">
    <span class="success-emoji">🎉</span>
    <div class="success-title">HARİKA! Tüm grupları buldunuz!</div>
    <div class="solve-time" id="solve-time-display"></div>
    <div class="community-stats" id="community-stats"></div>
  </div>

  <!-- Group results -->
  <div class="result-box">
    <h3>Bugünkü Gruplar</h3>
    <div id="group-results"></div>
  </div>

  <!-- Share box -->
  <div class="share-box">
    <p>Arkadaşlarını da daveyt et — onlar da çözebilir mi?</p>
    <div class="share-message-preview" id="share-preview">Yükleniyor...</div>
    <div class="social-icons">
      <a href="#" onclick="shareToWhatsApp(event)">
        <img src="https://www.bulmacan.com/icons/whatsap_icon.png" alt="WhatsApp">
        <span>WhatsApp</span>
      </a>
      <a href="#" onclick="shareToFacebook(event)">
        <img src="https://www.bulmacan.com/icons/face_icon.png" alt="Facebook">
        <span>Facebook</span>
      </a>
      <a href="#" onclick="shareToX(event)">
        <img src="https://www.bulmacan.com/icons/x_icon.png" alt="X">
        <span>X</span>
      </a>
      <a href="#" onclick="shareToInstagram(event)">
        <img src="https://www.bulmacan.com/icons/insta_icon.png" alt="Instagram">
        <span>Instagram</span>
      </a>
      <a href="#" onclick="copyLink(event)">
        <img src="https://www.bulmacan.com/icons/link_icon.png" alt="Kopyala">
        <span>Kopyala</span>
      </a>
    </div>
    <div class="copy-confirm" id="copy-confirm">✅ Kopyalandı!</div>
  </div>

</div>

<div id="smart-footer"></div>
<link rel="stylesheet" href="https://www.bulmacan.com/footer/footer.css">
<script src="https://www.bulmacan.com/footer/load_footer.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadFooter(); });
</script>

<script>
  const SUPABASE_URL = "https://aasreluvawvisaswbtzh.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhc3JlbHV2YXd2aXNhc3didHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDA0NDgsImV4cCI6MjA4OTAxNjQ0OH0.3WNhNot604dC_hkCbcc6QUapM7qnkHV-Qj3EtJmXxJo";

  const urlParams = new URLSearchParams(window.location.search);
  const selectedDate = urlParams.get("date");
  const solveTime = parseInt(urlParams.get("time") || "0", 10);

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m > 0 ? `${m} dakika ${s} saniye` : `${s} saniye`;
  }

  let shareText = "Bugünkü Kümelemece bulmacasını çözdüm! 🧩 Sen de dene! https://www.bulmacan.com/kumelemece/kumelemece_today.html";

  if (solveTime > 0) {
    shareText = `Bugünkü Kümelemece'yi ${formatTime(solveTime)} içinde çözdüm! 🧩 Sen çözebilir misin? https://www.bulmacan.com/kumelemece/kumelemece_today.html`;
    document.getElementById("solve-time-display").textContent = `⏱️ ${formatTime(solveTime)} içinde çözdünüz!`;
  }

  document.getElementById("share-preview").textContent = shareText;

  function shareToWhatsApp(event) {
    event.preventDefault();
    window.open("https://wa.me/?text=" + encodeURIComponent(shareText), "_blank");
  }

  function shareToFacebook(event) {
    event.preventDefault();
    window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent("https://www.bulmacan.com/kumelemece/kumelemece_today.html"), "_blank");
  }

  function shareToX(event) {
    event.preventDefault();
    window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText), "_blank");
  }

  function shareToInstagram(event) {
    event.preventDefault();
    navigator.clipboard.writeText(shareText).then(() => {
      document.getElementById("copy-confirm").style.display = "block";
      setTimeout(() => document.getElementById("copy-confirm").style.display = "none", 3000);
      alert("Mesaj kopyalandı! Instagram'da paylaşabilirsiniz. 📋");
    });
  }

  function copyLink(event) {
    event.preventDefault();
    navigator.clipboard.writeText(shareText).then(() => {
      const confirm = document.getElementById("copy-confirm");
      confirm.style.display = "block";
      setTimeout(() => confirm.style.display = "none", 3000);
    });
  }

  async function saveSolveTime(puzzleId, time) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/ratings`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ puzzle_id: puzzleId, solve_time: time })
      });
    } catch (err) { console.warn("Supabase save error:", err); }
  }

  async function fetchStats(puzzleId) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/ratings_summary?puzzle_id=eq.${puzzleId}&select=solve_count,avg_solve_time`,
        { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();
      if (data && data.length > 0) {
        const { solve_count, avg_solve_time } = data[0];
        document.getElementById("community-stats").textContent =
          `👥 Bugün ${solve_count} kişi çözdü — ortalama süre ${formatTime(avg_solve_time)}`;
      }
    } catch (err) { console.warn("Stats fetch error:", err); }
  }

  async function loadPuzzle() {
    const today = new Date();
    let puzzle = null;
    let loadedDate = null;

    if (selectedDate) {
      try {
        const res = await fetch(`/kumelemece/data/${selectedDate}.json`);
        if (res.ok) { puzzle = await res.json(); loadedDate = selectedDate; }
      } catch (e) {}
    }

    if (!puzzle) {
      for (let i = 0; i < 3650; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split("T")[0];
        try {
          const res = await fetch(`/kumelemece/data/${dateStr}.json`);
          if (res.ok) { puzzle = await res.json(); loadedDate = dateStr; break; }
        } catch (e) {}
      }
    }

    if (!puzzle || !puzzle.groups) {
      document.getElementById("group-results").innerHTML = "<p>Grup verileri bulunamadı.</p>";
      return;
    }

    const puzzleId = `k-${loadedDate}`;
    if (solveTime > 0) {
      await saveSolveTime(puzzleId, solveTime);
      await fetchStats(puzzleId);
    }

    const container = document.getElementById("group-results");
    puzzle.groups.forEach((group, index) => {
      const colorClass = group.class || `highlight-${index + 1}`;
      const wordBoxes = group.words.map(w => `<span class="word-highlight ${colorClass}">${w}</span>`).join("");
      container.innerHTML += `
        <div class="group-block">
          <div class="group-line">
            <div class="group-row">${wordBoxes}</div>
            <div class="group-label">→ ${group.label}</div>
          </div>
        </div>`;
    });
  }

  loadPuzzle();
</script>
</body>
</html>
