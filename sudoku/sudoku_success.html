<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Başarılı</title>
  <link rel="stylesheet" href="css_js/sudoku_css.css">
  <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
</head>
<body>

  <div id="smart-header"></div>
  <script src="https://www.bulmacan.com/header/load_header.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof loadHeader === "function") loadHeader("home");
    });

    function shareToWhatsApp(event) {
      event.preventDefault();
      const url = "https://www.bulmacan.com";
      navigator.clipboard.writeText(url).then(() => {
        window.open("https://wa.me/?text=" + encodeURIComponent(url), "_blank");
      });
    }

    function copyLink(event) {
      event.preventDefault();
      navigator.clipboard.writeText("https://www.bulmacan.com");
    }
  </script>

  <div class="page-container">

    <div class="success-message">
      <span class="emoji">🎉</span>
      <span>BRAVO! SUDOKU'yu çözdünüz.</span>
    </div>

    <!-- ⏱️ Personal solve time -->
    <div id="solve-time-display" style="font-size:1.1em; font-weight:bold; color:#444; margin:12px 0;"></div>

    <!-- 👥 Community stats -->
    <div id="community-stats" style="font-size:1em; color:#666; margin-bottom:16px;"></div>

    <div class="success-box-wrapper">
      <div class="success-box">
        👉 Bulmacaları beğendiniz mi?<br>
        Facebook'da bizi önermek için tıklayın<br>
        daha çok oyuncu, daha çok bulmaca! 😊
      </div>
    </div>

    <div class="social-icons">
      <a href="#"><img class="icon" src="https://www.bulmacan.com/icons/insta_icon.png" alt="Instagram"></a>
      <a href="#"><img class="icon" src="https://www.bulmacan.com/icons/pint_icon.png" alt="Pinterest"></a>
      <a href="#"><img class="icon" src="https://www.bulmacan.com/icons/face_icon.png" alt="Facebook"></a>
      <a href="#" onclick="shareToWhatsApp(event)"><img class="icon" src="https://www.bulmacan.com/icons/whatsap_icon.png" alt="WhatsApp"></a>
      <a href="#" onclick="copyLink(event)"><img class="icon" src="https://www.bulmacan.com/icons/link_icon.png" alt="Copy link"></a>
    </div>

  </div>

  <div id="smart-footer"></div>
  <link rel="stylesheet" href="https://www.bulmacan.com/footer/footer.css">
  <script src="https://www.bulmacan.com/footer/load_footer.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => { loadFooter(); });
  </script>

  <script>
    const SUPABASE_URL = "https://aasreluvawvisaswbtzh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhc3JlbHV2YXd2aXNhc3didHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDA0NDgsImV4cCI6MjA4OTAxNjQ0OH0.3WNhNot604dC_hkCbcc6QUapM7qnkHV-Qj3EtJmXxJo";

    const urlParams = new URLSearchParams(window.location.search);
    const selectedDate = urlParams.get("date");
    const solveTime = parseInt(urlParams.get("time") || "0", 10);

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m > 0 ? `${m} dakika ${s} saniye` : `${s} saniye`;
    }

    if (solveTime > 0) {
      document.getElementById("solve-time-display").textContent =
        `⏱️ Bu Sudoku'yu ${formatTime(solveTime)} içinde çözdünüz!`;
    }

    async function saveSolveTime(puzzleId, time) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/ratings`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({ puzzle_id: puzzleId, solve_time: time })
        });
      } catch (err) {
        console.warn("Supabase save error:", err);
      }
    }

    async function fetchStats(puzzleId) {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/ratings_summary?puzzle_id=eq.${puzzleId}&select=solve_count,avg_solve_time`,
          { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
        );
        const data = await res.json();
        if (data && data.length > 0) {
          const { solve_count, avg_solve_time } = data[0];
          document.getElementById("community-stats").textContent =
            `👥 Bugün ${solve_count} kişi bu Sudoku'yu çözdü — ortalama süre ${formatTime(avg_solve_time)}.`;
        }
      } catch (err) {
        console.warn("Stats fetch error:", err);
      }
    }

    async function init() {
      if (solveTime > 0 && selectedDate) {
        const puzzleId = `s-${selectedDate}`;
        await saveSolveTime(puzzleId, solveTime);
        await fetchStats(puzzleId);
      }
    }

    init();
  </script>
</body>
</html>
