<body>

  <div id="smart-header"></div>

  <div id="game-ui">
    <div id="timer">⏱️ Süre: 10:00</div>

    <div class="countdown-container">
      <div class="count-box filled"></div>
      <div class="count-box filled"></div>
      <div class="count-box filled"></div>
      <div class="count-box filled"></div>
      <div class="count-box filled"></div>
    </div>

    <div id="puzzle-title" class="puzzle-title"></div>
    <div id="puzzle-grid">Yükleniyor...</div>
    <button id="restart-btn" style="display:none;">🔄 Oyunu Yeniden Başlat</button>
    <div id="feedback"></div>
    <div id="hint-boxes"></div>
  </div>

  <div id="no-puzzle" style="display:none; margin-top:20px; font-weight:bold;">
    Bugünün bulmacası bulunamadı.
  </div>

  <div id="smart-footer"></div>

  <script>
    const dataPath = "data/";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedDate = urlParams.get("date");

    function getToday() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // ✅ Updated showResults — passes solve time to success page
    window.showResults = function(type, solveTime) {
      const dateParam = selectedDate ? `?date=${selectedDate}` : `?date=${getToday()}`;
      const timeParam = solveTime ? `&time=${solveTime}` : "";

      const target = type === "success"
        ? `kumelemece_success_today.html${dateParam}${timeParam}`
        : `kumelemece_timeout_today.html${dateParam}`;

      window.location.href = target;
    };

    async function loadPuzzle() {
      try {
        const dateToLoad = selectedDate || getToday();
        document.getElementById("puzzle-grid").innerHTML = "Yükleniyor...";

        const res = await fetch(`${dataPath}${dateToLoad}.json`);
        if (!res.ok) throw new Error("No puzzle for today");

        const puzzle = await res.json();

        if (typeof renderPuzzle === "function") {
          renderPuzzle(puzzle);
        } else {
          console.warn("renderPuzzle not found");
        }

      } catch (err) {
        console.warn("Puzzle load failed:", err);
        document.getElementById("game-ui").style.display = "none";
        document.getElementById("no-puzzle").style.display = "block";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        loadHeader("home");
        loadFooter();
      } catch (e) {
        console.warn("Header/Footer error:", e);
      }
      loadPuzzle();
    });
  </script>

</body>
</html>
