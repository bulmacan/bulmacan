<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KELIME AVI</title>
  <link rel="stylesheet" href="css_js/kelimeavi_css.css" />
  <link rel="icon" href="../icons/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../icons/site.webmanifest">
<meta property="og:title" content="Kelime Avı'nı tamamladım!">
<meta property="og:description" content="Bugünkü Kelime Avı'nı tamamladım! Sen de dene!">
<meta property="og:image" content="https://www.bulmacan.com/icons/share_kelimeavi.png">
<meta property="og:url" content="https://www.bulmacan.com/kelimeavi/kelimeavi.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.bulmacan.com/icons/share_kelimeavi.png">
</head>

<body>

<div id="smart-header"></div>
<script src="https://www.bulmacan.com/header/load_header.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadHeader("home"); });
</script>

<!-- ⏱️ Subtle stopwatch -->
<div id="timer" style="font-size:0.9em; font-weight:normal; color:#aaa; margin:8px 0; text-align:center;">⏱️ Süre: 00:00</div>

<!-- 🧩 Puzzle Info -->
<div id="subject">🗺️ Bugünkü konu: <strong id="puzzleTitle">Yükleniyor...</strong></div>
<div id="progress" style="font-size:1.2em; font-weight:bold; margin-top:10px; color:#2e7d32;">
  0 bulundu
</div>

<!-- 🔡 Puzzle Grid -->
<div id="game-container">
  <div id="grid"></div>
  <svg id="overlay"></svg>
</div>

<!-- 💬 Feedback -->
<div id="feedback"></div>

<div id="smart-footer"></div>
<link rel="stylesheet" href="https://www.bulmacan.com/footer/footer.css">
<script src="https://www.bulmacan.com/footer/load_footer.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadFooter(); });
</script>

<script>
let foundWords = 0;
let totalWords = 0;
let puzzle = null;
let loadedDate = null;

// ⏱️ Stopwatch
let startTime = null;
let timerInterval = null;

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById("timer").textContent = `⏱️ Süre: ${m}:${s}`;
}

function getSolveTime() {
  return Math.floor((Date.now() - startTime) / 1000);
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

const urlParams = new URLSearchParams(window.location.search);
const selectedDate = urlParams.get("date");

async function loadKelimeAvi() {
  const today = new Date();
  let data = null;

  if (selectedDate) {
    try {
      const res = await fetch(`/kelimeavi/data/${selectedDate}.json`);
      if (res.ok) { data = await res.json(); loadedDate = selectedDate; }
    } catch(e){}
  }

  if (!data) {
    for (let i = 0; i < 3650; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dateStr = d.toISOString().split("T")[0];
      try {
        const res = await fetch(`/kelimeavi/data/${dateStr}.json`);
        if (res.ok) { data = await res.json(); loadedDate = dateStr; console.log("Loaded fallback kelimeavi:", dateStr); break; }
      } catch(e){}
    }
  }

  if (!data) {
    document.getElementById("puzzleTitle").textContent = "Hiç bulmaca bulunamadı.";
    return;
  }

  puzzle = data;
  document.getElementById("puzzleTitle").textContent = puzzle.title;
  totalWords = puzzle.words.length;
  initializePuzzle(puzzle.matrix, puzzle.words);
  startTimer();
}

loadKelimeAvi();

function initializePuzzle(matrix, words) {
  const grid = document.getElementById("grid");
  const gridSize = matrix.length;
  let selectedCells = [];
  const usedCells = new Set();
  const foundSet = new Set();

  grid.innerHTML = "";

  matrix.forEach((row, r) => {
    row.forEach((letter, c) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = letter;
      cell.dataset.key = `${r},${c}`;
      grid.appendChild(cell);
      cell.addEventListener("click", () => handleCellClick(cell, r, c));
    });
  });

  function handleCellClick(cell, r, c) {
    const key = `${r},${c}`;
    if (usedCells.has(key)) return;

    if (selectedCells.includes(key)) {
      cell.classList.remove("selected");
      selectedCells = selectedCells.filter(k => k !== key);
    } else {
      cell.classList.add("selected");
      selectedCells.push(key);
    }

    const selectedLetters = selectedCells.map(k => {
      const [row, col] = k.split(",").map(Number);
      return matrix[row][col];
    }).join("");

    const match = words.find(w => w === selectedLetters);
    if (match && isAdjacentPath(selectedCells)) {
      markWordFound(match);
    }
  }

  function isAdjacentPath(cells) {
    for (let i = 1; i < cells.length; i++) {
      const [r1, c1] = cells[i-1].split(",").map(Number);
      const [r2, c2] = cells[i].split(",").map(Number);
      if (Math.abs(r1 - r2) > 1 || Math.abs(c1 - c2) > 1) return false;
    }
    return true;
  }

  function markWordFound(word) {
    // Draw SVG line from first to last cell
    drawLine(selectedCells);

    selectedCells.forEach(key => {
      usedCells.add(key);
      const [r, c] = key.split(",").map(Number);
      const index = r * gridSize + c;
      grid.children[index].classList.remove("selected");
      grid.children[index].classList.add("found");
    });

    foundSet.add(word);
    foundWords++;
    document.getElementById("progress").textContent = `${foundWords} / ${words.length} bulundu`;
    selectedCells = [];

    if (foundSet.size === words.length) {
      // All words found — go to success page
      clearInterval(timerInterval);
      const solveTime = getSolveTime();
      const dateParam = loadedDate || getToday();
      window.location.href = `kelimeavi_success.html?date=${dateParam}&time=${solveTime}`;
    }
  }

  function drawLine(cells) {
    if (cells.length < 2) return;

    const svg = document.getElementById("overlay");
    const gridEl = document.getElementById("grid");
    const gridRect = gridEl.getBoundingClientRect();
    const containerRect = document.getElementById("game-container").getBoundingClientRect();

    const getCellCenter = (key) => {
      const [r, c] = key.split(",").map(Number);
      const index = r * gridSize + c;
      const cell = gridEl.children[index];
      const rect = cell.getBoundingClientRect();
      return {
        x: rect.left - containerRect.left + rect.width / 2,
        y: rect.top - containerRect.top + rect.height / 2
      };
    };

    const start = getCellCenter(cells[0]);
    const end = getCellCenter(cells[cells.length - 1]);

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", start.x);
    line.setAttribute("y1", start.y);
    line.setAttribute("x2", end.x);
    line.setAttribute("y2", end.y);
    line.classList.add("line");
    svg.appendChild(line);
  }
}
</script>

</body>
</html>
